<!doctype html>
<html lang="ko" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도쿄 7구 대규모 맨션 가격추이</title>
<meta name="description" content="千代田・中央・港・新宿・文京・江東・渋谷 7개 구, 총 200세대 이상 맨션의 중고·신축분양 坪単価 추이">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏙️</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead-top">
      <h1 data-i18n="title">도쿄 7구 대규모 맨션 가격추이</h1>
      <div class="seg lang" id="lang-seg" role="group" aria-label="Language / 言語 / 언어">
        <button type="button" data-lang="ko" aria-pressed="true" lang="ko">한국어</button>
        <button type="button" data-lang="ja" aria-pressed="false" lang="ja">日本語</button>
      </div>
    </div>
    <p data-i18n-html="lede"></p>
    <div class="scope" id="scope-chips"></div>
  </header>

  <div class="banner" id="synthetic-banner" hidden>
    <span class="icon" aria-hidden="true">⚠</span>
    <div>
      <strong data-i18n="syntheticTitle"></strong>
      <p id="synthetic-detail"></p>
    </div>
  </div>

  <!-- 필터는 한 줄로 모아 아래 모든 차트에 동일하게 적용된다 -->
  <div class="filters" role="group" aria-label="표시 조건">
    <div class="field">
      <span class="field-label" id="lbl-wards" data-i18n="fArea">지역</span>
      <div class="chips" id="ward-chips" role="group" aria-labelledby="lbl-wards"></div>
    </div>

    <div class="field">
      <span class="field-label" id="lbl-units" data-i18n="fUnits">세대수</span>
      <div class="seg" id="units-seg" role="group" aria-labelledby="lbl-units"></div>
    </div>

    <div class="field">
      <span class="field-label" id="lbl-stage" data-i18n="fStage">구분</span>
      <div class="seg" id="stage-seg" role="group" aria-labelledby="lbl-stage">
        <button type="button" data-stage="used" aria-pressed="true" data-i18n="stageUsed">중고</button>
        <button type="button" data-stage="new" aria-pressed="false" data-i18n="stageNew">신축 분양</button>
        <button type="button" data-stage="both" aria-pressed="false" data-i18n="stageBoth">둘 다 비교</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label" id="lbl-range" data-i18n="fPeriod">기간</span>
      <div class="seg" id="range-seg" role="group" aria-labelledby="lbl-range">
        <button type="button" data-range="12" aria-pressed="false" data-i18n="r3y">3년</button>
        <button type="button" data-range="20" aria-pressed="false" data-i18n="r5y">5년</button>
        <button type="button" data-range="all" aria-pressed="true" data-i18n="rAll">전체</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label" id="lbl-scale" data-i18n="fScale">표시</span>
      <div class="seg" id="scale-seg" role="group" aria-labelledby="lbl-scale">
        <button type="button" data-scale="abs" aria-pressed="true" data-i18n="scaleAbs"></button>
        <button type="button" data-scale="idx" aria-pressed="false" data-i18n="scaleIdx"></button>
      </div>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <section class="card">
    <div class="card-head">
      <div>
        <h2 id="main-title"></h2>
        <p class="sub" id="main-sub"></p>
      </div>
      <button type="button" class="linkish" id="toggle-table" aria-expanded="false"></button>
    </div>
    <div class="chart-host" id="main-chart"></div>
    <div class="legend" id="main-legend"></div>
    <div class="table-wrap" id="main-table" hidden></div>
  </section>

  <section class="card" id="facet-card">
    <div class="card-head">
      <div>
        <h2 data-i18n="facetTitle"></h2>
        <p class="sub" data-i18n="facetSub"></p>
      </div>
    </div>
    <div class="facets" id="facets"></div>
  </section>

  <section class="card" id="map-card">
    <div class="card-head">
      <div>
        <h2 data-i18n="mapTitle"></h2>
        <p class="sub" id="map-sub"></p>
      </div>
      <button type="button" class="linkish" id="toggle-map-table" aria-expanded="false"></button>
    </div>
    <div class="chart-host" id="map-chart"></div>
    <div class="legend" id="map-legend"></div>
    <div class="table-wrap" id="map-table" hidden></div>
  </section>

  <section class="card" id="station-card">
    <div class="card-head">
      <div>
        <h2 data-i18n="stationTitle"></h2>
        <p class="sub" id="station-sub"></p>
      </div>
    </div>
    <div class="facets" id="station-facets"></div>
  </section>

  <section class="card" id="change-card">
    <div class="card-head">
      <div>
        <h2 data-i18n="changeTitle"></h2>
        <p class="sub" id="change-sub"></p>
      </div>
    </div>
    <div class="chart-host" id="change-chart"></div>
  </section>

  <section class="card" id="official-card" hidden>
    <div class="card-head">
      <div>
        <h2 data-i18n="officialTitle"></h2>
        <p class="sub" data-i18n-html="officialSub"></p>
      </div>
    </div>
    <div class="chart-host" id="official-chart"></div>
    <div class="legend" id="official-legend"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <div>
        <h2 data-i18n="newTitle"></h2>
        <p class="sub" id="new-sub"></p>
      </div>
    </div>
    <div id="new-listings"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <div>
        <h2 data-i18n="srcTitle"></h2>
        <p class="sub" data-i18n="srcSub"></p>
      </div>
    </div>
    <div class="sources" id="sources"></div>
  </section>

  <footer>
    <p id="generated"></p>
    <p data-i18n-html="footNote"></p>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
