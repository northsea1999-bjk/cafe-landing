<!doctype html>
<html lang="ko" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물건 입력 도우미</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📝</text></svg>">
<link rel="stylesheet" href="styles.css">
<style>
  .steps { display: grid; gap: 6px; margin: 0 0 18px; padding: 0 0 0 20px; color: var(--text-secondary); font-size: 13.5px; }
  textarea {
    width: 100%; min-height: 150px; padding: 12px 14px; font: inherit; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text-primary); resize: vertical;
  }
  textarea:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 14px; }
  .f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-secondary); }
  .f.req span { color: var(--text-primary); font-weight: 600; }
  .f input {
    font: inherit; font-size: 14px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface-1); color: var(--text-primary);
  }
  .f input:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  button.primary {
    font: inherit; font-size: 14px; font-weight: 600; padding: 9px 20px; min-height: 40px;
    border: 0; border-radius: 8px; background: var(--series-1); color: #fff; cursor: pointer;
  }
  button.ghost {
    font: inherit; font-size: 13.5px; padding: 8px 16px; min-height: 40px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text-primary); cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.del { font: inherit; font-size: 12px; padding: 2px 9px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface-2); color: var(--text-secondary); cursor: pointer; }
  .warn { color: var(--critical); font-size: 12.5px; min-height: 18px; margin-top: 10px; }
  .note { color: var(--text-muted); font-size: 12.5px; min-height: 18px; margin: 8px 0 0; }
  .count { font-size: 12px; color: var(--text-secondary); background: var(--surface-2);
    border-radius: 999px; padding: 2px 10px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead-top">
      <h1>물건 입력 도우미</h1>
      <a class="ghost" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">← 그래프로</a>
    </div>
    <p>포털 페이지를 눈으로 보고 옮겨 적는 작업을 줄여 줍니다. 다 담으면 CSV로 내려받아 수집기에 넣으세요.</p>
  </header>

  <section class="card">
    <div class="card-head"><div><h2>1. 페이지 글자 붙여넣기</h2>
      <p class="sub">물건 페이지에서 <strong>Ctrl+A → Ctrl+C</strong> 한 뒤 여기에 붙여넣고 버튼을 누르세요. 건너뛰고 아래에 직접 입력해도 됩니다.</p></div></div>
    <textarea id="paste" placeholder="여기에 붙여넣기"></textarea>
    <div class="actions"><button type="button" class="ghost" id="parse">값 찾아내기</button></div>
    <p class="note" id="parsed-note"></p>
  </section>

  <section class="card">
    <div class="card-head"><div><h2>2. 확인하고 고치기</h2>
      <p class="sub">자동으로 찾은 값은 <strong>자주 틀립니다.</strong> 눈으로 확인하고 고쳐 주세요. <strong>총세대수</strong>가 비면 그래프에 안 잡힙니다.</p></div></div>
    <div class="form" id="form"></div>
    <p class="warn" id="warn"></p>
    <div class="actions"><button type="button" class="primary" id="add">이 물건 담기</button></div>
  </section>

  <section class="card">
    <div class="card-head">
      <div><h2>3. 담은 물건 <span class="count" id="count">0건</span></h2>
      <p class="sub">브라우저에 저장되니 창을 닫아도 남아 있습니다.</p></div>
    </div>
    <div id="rows"></div>
    <div class="actions">
      <button type="button" class="primary" id="download">CSV 내려받기</button>
      <button type="button" class="ghost" id="clear">전부 비우기</button>
    </div>
  </section>

</div>
<script src="input.js"></script>
</body>
</html>
