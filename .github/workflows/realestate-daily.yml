name: 부동산 가격추이 일일 수집

on:
  schedule:
    # 매일 09:10 JST (00:10 UTC). 포털 갱신이 대체로 아침에 끝난 뒤를 노린다.
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realestate-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 수집 실행
        env:
          # 국토교통성 不動産情報ライブラリ 키 (없으면 성약가 추이만 건너뛴다)
          REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
        run: python3 -m realestate.collector.run --config realestate/config.json

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add realestate/web/data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(realestate): $(date -u +%Y-%m-%d) 수집 데이터 갱신"
          for i in 1 2 3 4; do
            git push && break
            echo "push 실패, 재시도 $i"
            sleep $((2 ** i))
            git pull --rebase
          done
